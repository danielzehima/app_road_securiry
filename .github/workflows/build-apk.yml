name: Tests et APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le projet Android
        run: |
          flutter create . --platforms android --project-name app_road_security --org ci.roadsecurity
          # Supprime le test d'exemple généré par Flutter (il vise une app « MyApp » qui n'existe pas)
          rm -f test/widget_test.dart

      - name: Ajouter les autorisations Android
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application#' "$MANIFEST"
          sed -i 's#android:label="app_road_security"#android:label="Sécurité Routière CI"#' "$MANIFEST"
          cat "$MANIFEST"

      - run: flutter pub get

      - name: Analyse du code
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Construire l'APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: securite-routiere-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Lien de téléchargement direct (sans zip, sans connexion) :
      # https://github.com/danielzehima/app_road_securiry/releases/latest/download/app-release.apk
      - name: Publier l'APK (lien direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Dernière version de test
          body: "APK de test généré automatiquement depuis la branche ${{ github.ref_name }} (commit ${{ github.sha }})."
          prerelease: false
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
